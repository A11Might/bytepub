[project]
name = "bytepub"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "playwright",
    "beautifulsoup4",
    "ebooklib",
    "lxml",
    "cairosvg",
]

[project.scripts]
bytepub = "src.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
